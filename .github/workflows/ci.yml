name: .NET Framework CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet Packages
      run: nuget restore NutritionFactsApp/NutritionFactsApp.csproj

    - name: Build Solution
      run: msbuild NutritionFactsApp/NutritionFactsApp.csproj /p:Configuration=Release /p:Platform="Any CPU"
